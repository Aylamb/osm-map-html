<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OSM 纯地图 · 零key · 定位+搜索</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root { --bg:#f7f8fa; --fg:#1b1d21; --line:#e3e6ea; --accent:#1a73e8; --sub:#666; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1d21; --fg:#e8eaed; --line:#33363b; --accent:#8ab4f8; --sub:#9aa0a6; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); }
  #app { position:fixed; inset:0; display:flex; flex-direction:column; }
  header { padding:10px 12px; border-bottom:1px solid var(--line); background:var(--bg); display:flex; gap:8px; align-items:center; }
  #q { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); font-size:15px; outline:none; }
  #q:focus { border-color:var(--accent); }
  #suggest { position:absolute; left:12px; right:12px; top:54px; max-height:46vh; overflow:auto; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:1000; display:none; }
  #suggest div { padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  #suggest div:last-child { border-bottom:none; }
  #suggest div:hover { background:var(--accent); color:#fff; }
  #suggest .sub { font-size:12px; color:var(--sub); margin-top:2px; }
  #map { flex:1; }
  .leaflet-popup-content { color:var(--fg); font-size:13px; }
  .hint { position:absolute; left:12px; bottom:14px; z-index:800; font-size:12px; color:var(--sub); background:var(--bg); border:1px solid var(--line); padding:6px 9px; border-radius:8px; }
  @media (prefers-color-scheme: dark){ .leaflet-popup-content-wrapper,.leaflet-popup-tip{ background:#26282c; color:#e8eaed; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <input id="q" placeholder="搜索地点，如：绵阳涪城区人民政府 / 北京中关村" autocomplete="off" />
  </header>
  <div id="suggest"></div>
  <div id="map"></div>
  <div class="hint">点击地图任意处可反查地址 · 打开即尝试定位 · 零 key</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const BEIJING = [39.9042, 116.4074];
const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView(BEIJING, 12);

// 零 key：OSM 官方瓦片（localhost/https 最稳，file:// 可能 403）
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors',
  referrerPolicy: 'no-referrer-when-downgrade'
}).addTo(map);

let meMarker = null, meCircle = null;
function showMe(lat, lng, acc){
  if (meMarker) map.removeLayer(meMarker);
  if (meCircle) map.removeLayer(meCircle);
  meCircle = L.circle([lat,lng], { radius:acc||80, color:'#1a73e8', fillColor:'#1a73e8', fillOpacity:.12, weight:1 }).addTo(map);
  meMarker = L.circleMarker([lat,lng], { radius:8, color:'#fff', weight:2, fillColor:'#1a73e8', fillOpacity:1 }).addTo(map);
  meMarker.bindPopup('📍 我的位置<br><small>'+lat.toFixed(5)+', '+lng.toFixed(5)+'</small>').openPopup();
  map.flyTo([lat,lng], 15, { duration:.8 });
}

map.whenReady(() => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p => showMe(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
    () => {},
    { enableHighAccuracy:true, timeout:8000, maximumAge:30000 }
  );
});

let pickMarker = null;
function pickPoint(lat, lng, label){
  if (pickMarker) map.removeLayer(pickMarker);
  pickMarker = L.marker([lat,lng]).addTo(map);
  pickMarker.bindPopup(label || '📌 '+lat.toFixed(5)+', '+lng.toFixed(5)).openPopup();
}

async function reverse(lat, lng){
  try {
    const r = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lng}&lang=zh`);
    const j = await r.json();
    const f = j.features && j.features[0];
    if (f){
      const p = f.properties;
      const name = [p.name, p.street, p.housenumber, p.city||p.county||p.state].filter(Boolean).join('，');
      pickPoint(lat, lng, '📌 '+(name||'未匹配到名称'));
      return;
    }
  } catch(e){}
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=zh-CN`, { headers:{ 'User-Agent':'osm-pure-map-demo' }});
    const j = await r.json();
    pickPoint(lat, lng, '📌 '+(j.display_name || '未匹配到地址'));
  } catch(e){ pickPoint(lat, lng); }
}
map.on('click', e => reverse(e.latlng.lat, e.latlng.lng));

const q = document.getElementById('q');
const box = document.getElementById('suggest');
let timer = null;

function render(list){
  box.innerHTML = '';
  if (!list.length){ box.style.display='none'; return; }
  list.forEach(it => {
    const d = document.createElement('div');
    d.innerHTML = `<div>${it.label}</div><div class="sub">${it.sub}</div>`;
    d.onclick = () => {
      box.style.display='none'; q.value = it.label;
      pickPoint(it.lat, it.lng, `📌 ${it.label}<br><small>${it.sub}</small>`);
      map.flyTo([it.lat, it.lng], 16, { duration:.8 });
    };
    box.appendChild(d);
  });
  box.style.display='block';
}

async function search(text){
  const t = text.trim();
  if (t.length < 1){ box.style.display='none'; return; }
  let items = [];
  try {
    const r = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(t)}&lang=zh&limit=8`);
    const j = await r.json();
    items = (j.features||[]).map(f => {
      const p = f.properties;
      return { lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0],
        label: p.name || p.street || p.city || t,
        sub: [p.street, p.housenumber, p.district||p.county||p.city||p.state].filter(Boolean).join('，') };
    });
  } catch(e){}
  if (items.length < 3){
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(t)}&limit=8&accept-language=zh-CN`, { headers:{ 'User-Agent':'osm-pure-map-demo' }});
      const j = await r.json();
      j.forEach(o => items.push({ lat:+o.lat, lng:+o.lon, label:o.name||o.display_name.slice(0,30), sub:o.display_name }));
    } catch(e){}
  }
  const seen = new Set();
  items = items.filter(it => { const k=it.lat+','+it.lng; if(seen.has(k))return false; seen.add(k); return true; }).slice(0,8);
  render(items);
}

q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(()=>search(q.value), 300); });
q.addEventListener('blur', () => setTimeout(()=>box.style.display='none', 180));
document.addEventListener('click', e => { if(!document.getElementById('app').contains(e.target)) box.style.display='none'; });
</script>
</body>
</html>
